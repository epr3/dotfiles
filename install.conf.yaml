- defaults:
    link:
      relink: true
      create: true
      glob: true

- clean: ['~']

- link:
    ~/.config/: .config/*
    ~/.pi/: .pi/*
    ~/.zshenv: .zshenv
    ~/.zshrc: .zshrc
    ~/.fvmrc: .fvmrc
    ~/git-clone-bare-for-worktrees.sh: scripts/git-clone-bare-for-worktrees.sh

- shell:
  -
    command: bash scripts/setup-git-identity.sh
    stdin: true
    stdout: true
    description: Set git identity
  -
    command: bash scripts/setup-git-clone-for-worktrees-alias.sh
    description: Register git clone-for-worktrees alias
    stdout: true
    stderr: true
  -
    command: bash scripts/install-homebrew.sh
    description: Install Homebrew
    stdout: true
    stderr: true
  -
    command: bash scripts/install-pnpm.sh
    description: Install pnpm
    stdout: true
    stderr: true
  -
    command: bash scripts/setup-node-lts.sh
    description: Set Node LTS via pnpm
    stdout: true
    stderr: true
  -
    command: bash scripts/install-pi.sh
    description: Install pi coding agent
    stdout: true
    stderr: true
  -
    command: brew bundle
    description: Install Homebrew packages
    stdout: true
    stderr: true
  -
    command: bash scripts/init-rtk-pi.sh
    description: Initialize RTK for Pi
    stdout: true
    stderr: true
  -
    command: bash scripts/install-gh-dash.sh
    description: Install gh-dash GitHub CLI extension
    stdout: true
    stderr: true

