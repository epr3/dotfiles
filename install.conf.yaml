- defaults:
    link:
      relink: true
      create: true
      glob: true

- clean: ['~']

- link:
    ~/.config/:
      path: .config/*
      exclude: [.config/superfile, .config/opencode]
    ~/.config/superfile/config.toml:
      path: .config/superfile/config.toml
      glob: false
      if: 'test ! -L "$HOME/.config/superfile"'
    ~/.pi/: .pi/*
    ~/.agents/skills: skills
    ~/.zshenv: .zshenv
    ~/.zshrc: .zshrc
    ~/.ignore: .ignore
    ~/git-clone-bare-for-worktrees.sh: scripts/git-clone-bare-for-worktrees.sh

- shell:
  -
    command: bash scripts/setup-git-identity.sh
    stdin: true
    stdout: true
    description: Set git identity
  -
    command: bash scripts/setup-git-clone-for-worktrees-alias.sh
    description: Register git clone-for-worktrees alias
    stdout: true
    stderr: true
  -
    command: bash scripts/install-homebrew.sh
    description: Install Homebrew
    stdout: true
    stderr: true
  -
    command: bash scripts/install-mise.sh
    description: Install mise
    stdout: true
    stderr: true
  -
    command: bash scripts/install-pnpm.sh
    description: Install pnpm
    stdout: true
    stderr: true
  -
    command: bash scripts/install-mise-tools.sh
    description: Install locked tools via mise
    stdout: true
    stderr: true
  -
    command: bash scripts/install-cocoapods.sh
    description: Install CocoaPods into the mise ruby
    stdout: true
    stderr: true
  -
    command: bash scripts/install-pi-extensions.sh
    description: Install pinned pi extensions
    stdout: true
    stderr: true
  -
    command: brew bundle
    description: Install Homebrew packages
    stdout: true
    stderr: true
  -
    command: bash scripts/install-pi-bolt.sh
    description: Verify Homebrew-owned pi-bolt and activate it as pi on fresh machines
    stdout: true
    stderr: true
  -
    command: bash scripts/init-rtk-pi.sh
    description: Initialize RTK for Pi
    stdout: true
    stderr: true
  -
    command: bash scripts/install-gh-dash.sh
    description: Install gh-dash GitHub CLI extension
    stdout: true
    stderr: true

