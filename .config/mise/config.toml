# Dotfile-managed global mise configuration, linked by Bootstrap to
# ~/.config/mise/config.toml. Declares language runtimes only: every
# standalone CLI stays Homebrew-owned (docs/mise-cli-ownership.md).
# Ownership + exceptions: docs/adr/2026-10-04-mise-managed-tool-boundary.md
# Operations (install, trust, lock, upgrade): docs/mise-acceptance.md
#
# Versions preserve inventoried existing installs; upgrades are deliberate:
# bump here, `mise lock --global`, review the diff, `mise install --locked`.

[tools]
# Inventory D1: reviewed default; the older pnpm copy (22.20.0) is not migrated.
node = "22.22.3"
# Sole pyenv version; moved cleanly (no user site-packages).
python = "3.12.4"
# First entry is the default (the old rbenv global); CocoaPods 1.15.2 is
# installed into it by scripts/install-cocoapods.sh.
ruby = ["3.3.0", "3.2.2"]
# `~/go/bin` stays on PATH in .zshenv so existing `go install`-ed tools resolve.
go = "1.27.1"
# Rust x86_64 under Rosetta (inventory D2): deliberately absent, blocked on a
# human decision — ~/.cargo/bin stays on PATH until then.

[tool_config]
# The committed mise.lock is authoritative: no silent re-resolution, no
# opportunistic upgrades, no lock rewrites.
locked = true

[settings]
# Runtime-version files (.nvmrc, .python-version, .ruby-version, .go-version,
# …) select versions in explicitly trusted projects.
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go"]
# Missing requested versions error with `mise install` guidance — never a
# download on directory entry, never a silent fallback.
not_found_auto_install = false
not_found_system_fallback = false
# The python 3.12.4 build publishes no GitHub attestations; locked resolution
# falls back to the SHA-256 checksums in mise.lock. Revisit with a python bump.
python.github_attestations = false
