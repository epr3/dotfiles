# Dotfile-managed global mise configuration: reviewed, locked Managed tool
# defaults. Linked by Bootstrap to ~/.config/mise/config.toml.
# Ownership: docs/adr/2026-10-04-mise-managed-tool-boundary.md
# Workflow: docs/mise-node-migration.md, docs/mise-runtime-migration.md
#
# Each version below preserves an inventoried existing installation (see
# docs/mise-runtime-migration.md and the migration inventory). No absent
# runtime needed a reviewed stable default. Upgrades are deliberate reviewed
# changes: bump the version here, run `mise lock --global`, review the
# lockfile diff, then `mise install --locked`.
#
# Explicit exceptions (not managed here — retained owners):
# - Flutter-Foundation fork: FVM honors `flutterUrl`; no mise backend
#   reproduces the fork (inventory §3, D6). See issue 05.
# - Rust x86_64 under Rosetta (inventory D2): blocked on a human decision;
#   not migrated.
# - bun 1.3.14 (Homebrew) and the standalone CLIs: decision deferred to
#   issue 04.

[tools]
# Node (inventory D1, signed off 2026-10-05): the mise default is the reviewed
# installed version 22.22.3. The older pnpm env copy (22.20.0) is NOT migrated;
# existing pnpm state remains on disk untouched.
node = "22.22.3"
# Python: the sole pyenv-managed version; the pyenv copy has no user
# site-packages (only pip), so the runtime moves cleanly.
python = "3.12.4"
# Ruby: both rbenv versions preserved; the first entry is the default (the
# rbenv global). CocoaPods 1.15.2 is installed explicitly into the mise ruby
# by a guarded Bootstrap stage — see scripts/install-cocoapods.sh.
ruby = ["3.3.0", "3.2.2"]
# Go: the Homebrew-installed version; `~/go/bin` stays on PATH in .zshenv so
# the existing `go install`-ed tools keep resolving.
go = "1.27.1"

[tool_config]
# Strict locking: tools declared by this config must resolve from the
# committed mise.lock — ordinary installs never silently re-resolve newer
# versions or rewrite the lock.
locked = true

[settings]
# Honor compatible runtime-version files (.nvmrc, .node-version,
# .python-version, .ruby-version, .go-version, etc.) in projects that have
# been explicitly trusted.
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go"]
# A missing requested version must produce actionable guidance, never a
# download triggered by a directory change or a silent fallback to another
# installation found on PATH. Install missing tools explicitly with
# `mise install` (after `mise trust`).
not_found_auto_install = false
not_found_system_fallback = false
# mise verifies GitHub artifact attestations for its python builds by default;
# the python-build-standalone release for 3.12.4 publishes none, so locked
# resolution would fail with "No GitHub artifact attestations found" and the
# lockfile cannot record platform entries. Verification falls back to the
# SHA-256 checksums mise records in mise.lock. Revisit only together with a
# reviewed python version bump.
python.github_attestations = false
